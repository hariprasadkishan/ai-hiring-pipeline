version: "3.8"

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: interview_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: admission_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:z

  # FastAPI Backend Service
  backend:
    build: ./backend
    container_name: interview_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:z
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpassword@mysql:3306/admission_db
    depends_on:
      - mysql

  # Next.js Frontend Service
  frontend:
    build: ./frontend
    container_name: interview_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mysql_data:
